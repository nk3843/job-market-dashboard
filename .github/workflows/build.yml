name: Build data

# Runs whenever new snapshots, lookup tables, or dbt code land on main. Only data that passes every dbt test
# is published to data/marts/, which the dashboard reads; if a test fails, nothing is published.
on:
  push:
    branches: [main]
    paths:
      - "data/snapshots/**"
      - "data/reference/**"
      - "transform/**"
      - "requirements*.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # to commit data/marts/ back (pushes made with this token don't re-trigger workflows)

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # latest commit, so a queued run includes snapshots that arrived meanwhile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dbt.txt
      - name: Build models and run data tests
        working-directory: transform
        run: dbt build --profiles-dir .
      - name: Export marts for the dashboard
        working-directory: transform
        run: python export_marts.py
      - name: Publish marts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marts
          git diff --cached --quiet && { echo "Marts unchanged."; exit 0; }
          git commit -m "Update marts $(date -u '+%F %H:%M')"
          git pull --rebase
          git push
      - name: Keep the dbt test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-results
          path: transform/target/run_results.json
          if-no-files-found: ignore
